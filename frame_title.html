<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Trang Chủ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        
        .header {
            width: 100%;
            height: 100%;
            display: flex;
        }
        
        /* LEFT: Avatar panel */
        .avatar-panel {
            width: 120px;
            height: 100%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1877f2 0%, #0d65d9 100%);
            padding: 15px;
        }
        
        .avatar-panel .logo-f {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 70px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -2px;
        }
        
        /* RIGHT: Info panel */
        .info-panel {
            flex: 1;
            height: 100%;
            background-image: url('image/title.png');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            padding: 10px 20px;
            overflow: hidden;
            position: relative;
        }
        
        /* Overlay mờ nhẹ để text rõ hơn */
        .info-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to right, rgba(0, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0.05) 60%);
            pointer-events: none;
        }
        
        .info {
            color: #ffffff;
            position: relative;
            z-index: 1;
        }
        
        .info h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 8px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            letter-spacing: 0.5px;
        }
        
        .info .subtitle {
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 6px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
        }
        
        .info .tagline {
            font-size: 0.9rem;
            font-style: italic;
            color: #ff4d4d;
            margin-top: 8px;
            overflow: hidden;
            white-space: nowrap;
        }
        
        .info .tagline span {
            display: inline-block;
            animation: marquee 8s linear infinite;
        }
        
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="avatar-panel">
            <div class="logo-f">D</div>
        </div>
        <div class="info-panel">
            <div class="info">
                <h1>MAI TUẤN ANH (Danbii)</h1>
                <p class="subtitle">Trang Web Bài Tập HTML</p>
                <p class="subtitle">FACEBOOK - HỌC THEO CÁCH CỦA BẠN</p>
                <p class="tagline"><span>Đừng lo lắng về ngày mai, vì ngày mai bạn vẫn còn phải lo về ngày mốt.</span></p>
            </div>
        </div>
    </div>
</body>
</html>
