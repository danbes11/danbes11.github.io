<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Footer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        
        .footer {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .footer-text {
            color: #65676b;
            font-size: 0.75rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="footer">
        <div class="footer-text">
            © 2026 · Website by Danbii
        </div>
    </div>
</body>
</html>
