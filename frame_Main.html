<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Nội Dung</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            height: 100%;
            overflow-y: auto;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: transparent;
        }
        
        .content-wrapper {
            padding: 16px;
        }
        
        /* Create Post Box */
        .create-post {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
            padding: 12px 16px;
            margin-bottom: 12px;
        }
        
        .create-post-top {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #1877f2, #166fe5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }
        
        .create-post input {
            flex: 1;
            height: 40px;
            background: #f0f2f5;
            border: none;
            border-radius: 20px;
            padding: 0 16px;
            font-size: 0.95rem;
            color: #1c1e21;
            cursor: pointer;
        }
        
        .create-post input::placeholder {
            color: #65676b;
        }
        
        .create-post-divider {
            height: 1px;
            background: #dadde1;
            margin: 12px 0;
        }
        
        .create-post-actions {
            display: flex;
            justify-content: space-around;
        }
        
        .action-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            color: #65676b;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background 0.2s;
        }
        
        .action-item:hover {
            background: #f0f2f5;
        }
        
        /* Welcome Card */
        .welcome-card {
            background: linear-gradient(135deg, #1877f2 0%, #166fe5 100%);
            border-radius: 8px;
            padding: 20px;
            color: white;
            margin-bottom: 12px;
        }
        
        .welcome-card h2 {
            font-size: 1.4rem;
            margin-bottom: 8px;
        }
        
        .welcome-card p {
            font-size: 0.95rem;
            opacity: 0.9;
            line-height: 1.5;
        }
        
        /* Content placeholder */
        .content-area {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
            padding: 60px 20px;
            text-align: center;
            color: #65676b;
        }
        
        .content-area .icon {
            font-size: 4rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        
        .content-area h3 {
            font-size: 1.3rem;
            color: #1c1e21;
            margin-bottom: 8px;
        }
        
        .content-area p {
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <!-- Create Post -->
        <div class="create-post">
            <div class="create-post-top">
                <div class="user-avatar">D</div>
                <input type="text" placeholder="Bạn đang nghĩ gì?">
            </div>
            <div class="create-post-divider"></div>
            <div class="create-post-actions">
                <div class="action-item">📷 Video trực tiếp</div>
                <div class="action-item">🖼️ Ảnh/Video</div>
                <div class="action-item">😊 Cảm xúc</div>
            </div>
        </div>
        
        <!-- Welcome Card -->
        <div class="welcome-card">
            <h2>Chào mừng đến với website!</h2>
            <p>Chọn bài tập từ menu bên trái để bắt đầu học tập. Chúc bạn một ngày học tập vui vẻ!</p>
        </div>
        
        <!-- Content Area -->
        <div class="content-area">
            <div class="icon">📚</div>
            <h3>Nội dung bài tập sẽ hiển thị ở đây</h3>
            <p>Chọn một bài học từ menu bên trái</p>
        </div>
    </div>
</body>
</html>
