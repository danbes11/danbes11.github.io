<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Nội Dung Chính</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }
        
        .placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #999;
        }
        
        .placeholder .icon {
            font-size: 5rem;
            margin-bottom: 25px;
            opacity: 0.4;
        }
        
        .placeholder h2 {
            font-size: 1.6rem;
            margin-bottom: 12px;
            color: #aaa;
        }
        
        .placeholder p {
            font-size: 1rem;
            color: #bbb;
        }
    </style>
</head>
<body>
    <div class="placeholder">
        <div class="icon">📄</div>
        <h2>Nội dung sẽ hiển thị ở đây</h2>
        <p>Vui lòng chọn bài học hoặc bài tập từ menu bên trái</p>
    </div>
</body>
</html>
